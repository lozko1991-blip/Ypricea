name: Update price catalog

on:
  schedule:
    - cron: '0 */2 * * *'   # кожні 2 години (UTC: 00,02,04,06,08,10,12,14,16,18,20,22)
  workflow_dispatch: {}      # ручний запуск кнопкою
  repository_dispatch:
    types: [ manual_rebuild ] # запуск через API з кабінету адміна
  push:
    branches: [ main ]
    paths:
      - 'process.mjs'
      - 'customExports.mjs'
      - 'presets/**'
      - 'frontend/**'
      - '.github/workflows/update.yml'
      - 'suppliers/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root deps
        run: npm install --no-audit --no-fund

      - name: Fetch and Process Data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node process.mjs

      - name: Build React Frontend
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build

      - name: Delete old cache
        run: |
          gh cache delete site-build-latest --repo ${{ github.repository }} 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save build to cache
        uses: actions/cache/save@v4
        with:
          path: frontend/dist
          key: site-build-latest

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
